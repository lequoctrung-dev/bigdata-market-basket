spring.application.name=bigdata-market-basket
app.mode=DEVELOPMENT
spring.main.log-startup-info=false
logging.level.org.mongodb.driver=WARN
server.address=127.0.0.1
server.port=8081
spring.mongodb.uri=mongodb://127.0.0.1:27019/bigdata_m2?directConnection=true&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=5000
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
# Allows every train catalog item (4,556), without truncating a valid basket.
server.tomcat.max-parameter-count=10000
server.tomcat.max-http-form-post-size=2MB
